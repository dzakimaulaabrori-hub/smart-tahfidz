<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TAHFIDZ — SD Al Irsyad</title>
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F2E7; --surface:#FFFFFF; --ink:#1A211C; --ink-soft:#5F6B61;
    --primary:#153A2E; --primary-light:#2B6350; --primary-dark:#0E2921;
    --accent:#B6842A; --accent-soft:#F1E3BE; --accent-deep:#8A6118;
    --border:#E4DFCB; --border-soft:#EDE9D9; --danger:#A63F29; --danger-soft:#F7E3DD; --good:#2B6350; --good-soft:#DEEBE4;
    --color-background:var(--bg); --color-surface:var(--surface); --color-surface-muted:#FBFAF4;
    --color-primary:var(--primary); --color-primary-hover:var(--primary-light); --color-primary-dark:var(--primary-dark);
    --color-accent:var(--accent); --color-accent-deep:var(--accent-deep); --color-accent-soft:var(--accent-soft);
    --color-text:var(--ink); --color-text-muted:var(--ink-soft); --color-border:var(--border); --color-border-soft:var(--border-soft);
    --shadow-sm: 0 1px 2px rgba(20,30,24,.05);
    --shadow-md: 0 4px 16px rgba(20,30,24,.07), 0 1px 3px rgba(20,30,24,.05);
    --shadow-lg: 0 16px 40px rgba(20,30,24,.12), 0 2px 8px rgba(20,30,24,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;}
  h1,h2,h3,.serif{font-family:'Newsreader',serif; letter-spacing:-.01em;}
  a{color:inherit;}
  .app{display:flex; min-height:100vh;}
  ::selection{ background: var(--accent-soft); color: var(--ink); }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* ---------- GATE (login) ---------- */
  #gate{position:fixed; inset:0; min-height:100dvh; background:
      radial-gradient(1100px 700px at 12% -10%, rgba(21,58,46,.06), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(182,132,42,.08), transparent 55%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; z-index:200; flex-direction:column; gap:14px;
    padding:clamp(20px, 4vw, 48px); overflow-y:auto; overflow-x:hidden;}
  #gate.hidden{display:none;}
  .gate-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:clamp(24px, 4vw, 38px) clamp(20px, 4vw, 34px) clamp(22px, 3vw, 32px);
    max-width:390px; width:100%; text-align:center; box-shadow:var(--shadow-lg); position:relative; min-width:0;}
  .gate-card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary) 33%, var(--accent) 33%, var(--accent) 66%, var(--primary-light) 66%);}
  .logo{font-family:'Newsreader',serif; font-size:29px; font-weight:600; color:var(--primary); letter-spacing:-.01em;}

  /* ---------- LOGIN FORM REDESIGN (Simplified, no lamp animation) ---------- */
  .lamp-scene{position:fixed; inset:0; z-index:201; display:none; align-items:center; justify-content:center;
    min-height:100dvh; padding:clamp(20px, 4vw, 48px); overflow-y:auto; overflow-x:hidden;
    background:var(--bg);}
  .lamp-scene[style*="display: flex"]{display:flex !important;}
  .lamp-scene::before{content:''; display:none;}
  .lamp-scene.lamp-on{background:var(--bg);}
  .lamp-scene.lamp-on::before{display:none;}

  /* Hide lamp SVG and animation elements */
  .lamp-wrapper{display:none;}
  .lamp-svg{display:none;}
  .lamp-shade{display:none;}
  .lamp-base-part{display:none;}
  .inner-glow{display:none;}
  .cord-line{display:none;}
  .cord-bead{display:none;}
  .cord-hit{cursor:pointer; display:none;}
  .lamp-hint-dark{display:none;}

  /* Login card styling - simplified and professional */
  .lamp-card{position:relative; z-index:3; width:min(100%, 390px); margin:0 auto;
    opacity:1; transform:none; pointer-events:auto; transition:none;}
  .lamp-scene.lamp-on .lamp-card{opacity:1; transform:none; pointer-events:auto;}

  .lamp-card .logo-icon-lg{width:58px; height:58px; border-radius:16px; margin:0 auto 14px; box-shadow:var(--shadow-md); object-fit:contain; background:var(--surface); padding:6px;}
  .lamp-card .logo{font-size:clamp(22px, 5vw, 26px); line-height:1.2; letter-spacing:-.01em; color:var(--primary); margin-bottom:4px;}
  .lamp-card .subtitle{font-size:13px; color:var(--ink-soft); margin-bottom:20px; line-height:1.4;}
  .lamp-card .field{margin-bottom:16px;}
  .lamp-card .field label{font-size:12px; margin-bottom:7px; color:var(--ink-soft);}
  .lamp-card input{min-height:44px; font-size:14px; border-radius:10px; border:1.5px solid var(--border); transition:border-color .15s, box-shadow .15s;}
  .lamp-card input:hover{border-color:var(--primary-light);}
  .lamp-card input:focus{border-color:var(--primary); box-shadow:0 0 0 4px rgba(21,58,46,.08);}
  .lamp-card .btn{min-height:44px; width:100%; font-size:14px; margin-top:8px; border-radius:10px; transition:filter .15s, transform .1s;}
  .lamp-card .btn:hover{filter:brightness(1.03);}
  .lamp-card .btn:active{transform:translateY(1px);}
  .lamp-card #loginMsg{margin-top:12px !important; line-height:1.4; font-size:13px;}
  .logo-brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .logo-brand .logo{white-space:nowrap;}
  .logo-icon{width:32px; height:32px; border-radius:8px; flex-shrink:0; display:block; object-fit:contain; box-shadow:var(--shadow-sm); background:var(--surface); padding:4px;}
  .logo-icon-lg{width:56px; height:56px; border-radius:14px; margin:0 auto 12px; box-shadow:var(--shadow-md); object-fit:contain; background:var(--surface); padding:5px;}
  .sidebar .logo{color:#fff;}

  /* ---------- SIDEBAR (dengan tekstur lattice islami) ---------- */
  .sidebar{width:238px; background:var(--primary); color:#fff; padding:26px 20px; flex-shrink:0;
    position:sticky; top:0; height:100vh; display:flex; flex-direction:column; overflow-y:auto;
    background-image:
      linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 1.5px, transparent 1.5px 26px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.028) 0 1.5px, transparent 1.5px 26px);
    background-blend-mode: normal, screen, screen;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:10px;}
  .logo-sub{font-size:10.5px; opacity:.6; margin-bottom:26px; letter-spacing:.12em; font-weight:600;}
  .child-select{margin-bottom:18px;}
  .child-select select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.07); color:#fff; font-size:13px; font-family:'Inter',sans-serif;}
  .navitem{display:flex; align-items:center; padding:10px 13px; border-radius:10px; color:rgba(255,255,255,.68);
    font-size:13.5px; margin-bottom:3px; cursor:pointer; transition:background .15s, color .15s, padding-left .15s;
    border-left:3px solid transparent; font-weight:500;}
  .navitem:hover{background:rgba(255,255,255,.07); color:#fff;}
  .navitem.active{background:rgba(255,255,255,.13); color:#fff; font-weight:600; border-left-color:var(--accent); padding-left:16px;}
  .navitem .count{margin-left:auto; background:var(--accent); color:#241a05; border-radius:20px; padding:1px 8px; font-size:10.5px; font-weight:700;}
  .who{margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.13); font-size:12.5px; opacity:.85;}
  .who div:first-child{font-weight:600; color:#fff; opacity:1;}
  .who .logout{cursor:pointer; color:rgba(255,255,255,.6); margin-top:7px; display:inline-block; font-size:12px; transition:color .15s;}
  .who .logout:hover{color:var(--accent);}

  /* ---------- MAIN ---------- */
  .main{flex:1; padding:38px 44px 60px; max-width:1120px;}
  .pagehead{margin-bottom:26px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;}
  .pagehead h1{font-size:27px; font-weight:600; color:var(--ink);}
  .pagehead p{color:var(--ink-soft); font-size:13px; margin-top:4px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px;
    margin-bottom:18px; box-shadow:var(--shadow-sm); transition:box-shadow .2s;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px;}
  @media (max-width:820px){ .grid-3,.grid-4{grid-template-columns:1fr 1fr;} }
  .stat-num{font-family:'Newsreader',serif; font-size:30px; font-weight:600; color:var(--primary); line-height:1.1;}
  .stat-num.neg{color:var(--danger);}
  .stat-label{font-size:12px; color:var(--ink-soft); margin-top:6px; font-weight:500;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .table-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .table-wrap table{min-width:620px;}
  th{text-align:left; color:var(--ink-soft); font-weight:600; padding:10px 12px; border-bottom:1.5px solid var(--border);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;}
  td{padding:12px; border-bottom:1px solid var(--border-soft); vertical-align:top;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:#FBFAF4;}
  tr:last-child td{border-bottom:none;}

  .btn{background:var(--primary); color:#fff; border:none; padding:10px 20px; border-radius:10px;
    font-size:13.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:var(--shadow-sm);
    transition:background .15s, transform .1s;}
  .btn:hover{background:var(--primary-light);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 13px; font-size:12px; border-radius:8px;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid transparent; padding:5px 9px; font-size:12px;
    cursor:pointer; border-radius:7px; font-weight:600; transition:background .15s;}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-reject{background:transparent; color:var(--danger); border:1px solid var(--danger); border-radius:8px; font-weight:600;}
  .btn-reject:hover{background:var(--danger-soft);}

  .field{margin-bottom:17px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:7px; font-weight:600;}
  input,select{width:100%; padding:10px 13px; border:1.5px solid var(--border); border-radius:10px; font-size:13.5px;
    font-family:'Inter',sans-serif; background:#fff; color:var(--ink); transition:border-color .15s;}
  input:focus,select:focus{outline:none; border-color:var(--primary-light);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  @media (max-width:640px){ .row2,.row3{grid-template-columns:1fr;} }

  .add-form{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:flex-end;}
  .add-form .f{display:flex; flex-direction:column; gap:5px;}
  .add-form label{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .add-form input,.add-form select{width:auto;}

  .checklist{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .check-row{display:flex; align-items:center; gap:10px; padding:11px 13px; border:1.5px solid var(--border);
    border-radius:10px; cursor:pointer; transition:border-color .15s, background .15s;}
  .check-row:hover{border-color:var(--primary-light);}
  .check-row.checked{border-color:var(--primary); background:var(--good-soft);}
  .check-row input{width:auto;}
  .check-row .poin-tag{margin-left:auto; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .poin-plus{background:var(--good-soft); color:var(--good);}
  .poin-minus{background:var(--danger-soft); color:var(--danger);}

  .toggle-group{display:flex; gap:8px;}
  .toggle-btn{flex:1; padding:11px; border:1.5px solid var(--border); border-radius:10px; text-align:center;
    font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; transition:.15s;}
  .toggle-btn:hover{border-color:var(--primary-light);}
  .toggle-btn.sel{background:var(--primary); color:#fff; border-color:var(--primary);}

  .toast{position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:13px 20px;
    border-radius:11px; font-size:13px; opacity:0; transform:translateY(10px); transition:.25s; z-index:100;
    box-shadow:var(--shadow-lg); font-weight:500;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--danger);}
  .empty{color:var(--ink-soft); font-size:13px; padding:26px 0; text-align:center;}
  .page{display:none;} .page.active{display:block; animation:fadeIn .2s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent-deep);}
  .badge-plus{background:var(--good-soft); color:var(--good);}
  .badge-minus{background:var(--danger-soft); color:var(--danger);}
  .badge-pending{background:var(--accent-soft); color:var(--accent-deep);}
  .badge-approved{background:var(--good-soft); color:var(--good);}
  .badge-rejected{background:var(--danger-soft); color:var(--danger);}
  .chart-wrap{position:relative; height:280px;}

  /* ---------- MOBILE TOP BAR (hanya tampil di layar sempit) ---------- */
  .mobile-topbar{display:none;}
  .app-header-actions{position:fixed; top:20px; right:28px; z-index:140;}
  .app-header-actions .btn-logout{min-height:38px; padding:8px 14px;}

  /* ---------- RESPONSIVE: TABLET & MOBILE ---------- */
  @media (max-width:900px){
    .main{padding:30px 24px 50px;}
  }
  @media (max-width:480px){
    .grid-3,.grid-4{grid-template-columns:1fr 1fr;}
    .pagehead h1{font-size:22px;}
    .card{padding:18px 16px;}
  }

  @media (max-width:768px){
    body{ padding-top:56px; }
    .mobile-topbar{
      display:flex; align-items:center; gap:12px; position:fixed; top:0; left:0; right:0; height:56px;
      background:var(--primary); color:#fff; padding:0 16px; z-index:150; box-shadow:var(--shadow-sm);
    }
    .mobile-topbar .logo{font-size:19px; color:#fff;}
    .mobile-topbar .logo-icon{width:26px; height:26px; border-radius:6px;}
    .mobile-topbar button{
      background:rgba(255,255,255,.1); border:none; color:#fff; width:36px; height:36px; border-radius:9px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    }
    .mobile-topbar button svg{width:20px; height:20px;}

    .app{ display:block; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; height:100vh; z-index:180; width:250px;
      transform:translateX(-104%); transition:transform .25s ease; box-shadow:var(--shadow-lg);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-overlay{
      display:none; position:fixed; inset:0; background:rgba(17,20,17,.45); z-index:170;
    }
    .sidebar-overlay.open{ display:block; }

    .main{ max-width:100%; padding:22px 16px 50px; margin-top:0; }
    .pagehead{ margin-bottom:20px; }
    .pagehead h1{ font-size:21px; }
    .grid-3,.grid-4{ grid-template-columns:1fr 1fr; gap:10px; }
    .stat-num{ font-size:22px; }
    .row2,.row3{ grid-template-columns:1fr; }
    .add-form{ flex-direction:column; align-items:stretch; }
    .add-form .f{ width:100%; }
    .add-form input,.add-form select{ width:100%; }

    /* tabel jadi bisa digeser ke samping daripada mepet/kepotong */
    .card{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table{ min-width:560px; }

    .chart-wrap{ height:220px; }
    .toast{ left:16px; right:16px; bottom:16px; text-align:center; }
  }

  /* ---------- LOGIN/LAMP REFINEMENT ---------- */
  /* Responsive login form - ensure centered and readable on all screen sizes */
  @media (max-width:480px){
    #gate{padding:16px;}
    .lamp-scene{padding:16px;}
    .lamp-card{width:100%;}
    .lamp-card .logo-icon-lg{width:48px; height:48px;}
    .lamp-card .logo{font-size:20px;}
  }

  @media (max-width:767px){
    .app-header-actions{display:none;}
    #gate{padding:clamp(16px, 5vh, 32px);}
    .lamp-scene{padding:clamp(16px, 5vh, 32px);}
    .lamp-card{width:100%;}
  }

  @media (min-width:768px){
    .lamp-scene{padding:clamp(40px, 8vw, 80px);}
  }

  /* ---------- DASHBOARD RESPONSIVE REFINEMENT ---------- */
  body{overflow-x:hidden;}
  .app{min-height:100dvh;}
  .logo{font-size:20px; line-height:1.15; font-weight:600;}
  .sidebar .logo{font-size:20px;}
  .main{width:100%;}

  @media (min-width:1024px){
    .sidebar{width:238px;}
    .main{max-width:1120px; padding:40px 48px 64px;}
    .grid-3,.grid-4{gap:18px;}
    .card{padding:22px 24px;}
    .pagehead h1{font-size:27px;}
    .pagehead p{font-size:14px;}
  }

  @media (min-width:768px) and (max-width:1023px){
    .sidebar{width:220px; padding:24px 16px;}
    .sidebar .logo{font-size:19px;}
    .main{max-width:none; padding:30px 24px 52px;}
    .grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
    .card{padding:20px;}
    .pagehead h1{font-size:25px;}
    .row3{grid-template-columns:repeat(2,minmax(0,1fr));}
    table{font-size:13px;}
  }

  @media (max-width:767px){
    body{min-height:100dvh; padding-top:56px;}
    .mobile-topbar{height:56px; padding:0 16px; gap:10px;}
    .mobile-topbar .logo{font-size:18px;}
    .mobile-topbar button{width:44px; height:44px; min-width:44px;}
    .mobile-topbar .btn-logout-mobile{margin-left:auto; width:auto; min-width:44px; padding:0 12px; font-size:12px;}
    .app{display:block; min-height:100dvh;}
    .main{max-width:none; min-width:0; padding:20px 16px 44px;}
    .pagehead{margin-bottom:18px; gap:8px;}
    .pagehead h1{font-size:23px; line-height:1.2;}
    .pagehead p{font-size:14px;}
    .grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
    .card{min-width:0; padding:16px; border-radius:12px; overflow:visible;}
    .stat-num{font-size:22px;}
    .stat-label{font-size:12px;}
    .row2,.row3{grid-template-columns:1fr; gap:0;}
    .add-form{flex-direction:column; align-items:stretch; gap:12px;}
    .add-form .f,.add-form input,.add-form select{width:100%;}
    .field{margin-bottom:14px;}
    .field label{font-size:13px;}
    input,select{min-height:44px; font-size:15px;}
    .btn{min-height:44px; width:100%; font-size:14px;}
    .toggle-btn{min-height:44px; font-size:13px;}
    table{display:block; width:100%; min-width:0; overflow-x:auto; -webkit-overflow-scrolling:touch; font-size:13px;}
    table thead,table tbody{display:table; width:100%; min-width:560px; table-layout:auto;}
    th{font-size:10px; padding:9px 10px;}
    td{padding:10px;}
    .chart-wrap{height:220px;}
    body:has(.sidebar.open){overflow:hidden;}
  }

  /* ---------- FINAL UI/UX PASS ---------- */
  .app-header-actions{top:16px; right:24px;}
  .app-header-actions .btn-logout{width:auto; min-width:84px;}
  /* Leave room for the fixed desktop action without making the content feel pushed down. */
  .main{padding-top:40px;}
  .logo-brand{min-width:0; flex:1;}
  .logo-brand .logo{overflow:hidden; text-overflow:ellipsis; min-width:0;}

  .lamp-card .logo-icon-lg{
    display:block; width:clamp(48px, 12vw, 64px); height:auto; aspect-ratio:1;
    margin:0 auto 16px; object-fit:contain;
  }

  @media (min-width:768px) and (max-width:1023px){
    .main{padding-top:30px;}
  }

  @media (max-width:767px){
    .main{padding-top:20px;}
    .mobile-topbar{display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:8px;}
    .mobile-topbar .logo-brand{gap:8px; min-width:0; overflow:hidden;}
    .mobile-topbar .logo-icon{width:28px; height:28px; padding:3px; border-radius:7px;}
    .mobile-topbar .logo{font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .mobile-topbar .btn-logout-mobile{margin-left:0; min-width:64px; width:auto; height:40px; padding:0 10px; white-space:nowrap;}

    /* Keep data usable without forcing the whole page to scroll sideways. */
    .card{overflow:visible;}
    .card table, table{display:table; width:100%; min-width:0; table-layout:fixed; font-size:12px; word-break:break-word;}
    table thead, table tbody{display:table-row-group; width:auto; min-width:0;}
    th,td{padding:8px 6px; overflow-wrap:anywhere;}
    th{font-size:9px; letter-spacing:.03em;}
    .chart-wrap{max-width:100%; overflow:hidden;}
  }

  @media (max-width:360px){
    .mobile-topbar{grid-template-columns:40px minmax(0,1fr) auto; gap:5px; padding:0 10px;}
    .mobile-topbar .logo{font-size:16px;}
    .mobile-topbar .btn-logout-mobile{min-width:58px; padding:0 8px; font-size:11px;}
  }
</style>

<script>
const SMART_CONFIG = window.SMART_TAHFIDZ_CONFIG || {};
const SUPABASE_URL = SMART_CONFIG.url || '';
const SUPABASE_ANON_KEY = SMART_CONFIG.anonKey || '';
const sb = SUPABASE_URL && SUPABASE_ANON_KEY && typeof supabase !== 'undefined'
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let supabaseHealth = { status: sb ? 'unknown' : 'config_missing', error: null };

async function checkSupabaseConnection(){
  if (!SMART_CONFIG.url || !SMART_CONFIG.anonKey) {
    return { status:'config_missing', error:new Error('Supabase configuration is missing.') };
  }
  if (typeof supabase === 'undefined' || !sb) {
    return { status:'client_unavailable', error:new Error('Supabase client is unavailable.') };
  }
  const { data, error } = await sb.from('quran_juz').select('nomor').limit(1);
  if (!error) {
    supabaseHealth = { status:'connected', error:null };
    return { status:'connected', data, error:null };
  }
  const code = error.code || '';
  if (code === '42P01' || code === 'PGRST205' || /relation .* does not exist|table .* not found/i.test(error.message || '')) {
    supabaseHealth = { status:'schema_missing', error };
    return { status:'schema_missing', data:null, error };
  }
  if (code === '42501' || /permission denied|row-level security|\bRLS\b/i.test(error.message || '')) {
    supabaseHealth = { status:'rls_denied', error };
    return { status:'rls_denied', data:null, error };
  }
  supabaseHealth = { status:'connection_failed', error };
  return { status:'connection_failed', data:null, error };
}

function sameSuratName(a,b){
  return (a||'').replace(/[’‘]/g,"'").toLowerCase() === (b||'').replace(/[’‘]/g,"'").toLowerCase();
}
let quranMasterLoaded = false;
async function loadQuranMasterFromDatabase(){
  if (quranMasterLoaded) return JUZ_SURAT_MAP;
  if (!sb) throw new Error('Supabase client belum tersedia.');
  // Query the mapping and the master table separately. This avoids depending
  // on a nested PostgREST relationship name when rendering the dropdown.
  const [{ data: mapping, error: mappingError }, { data: suratMaster, error: suratError }] = await Promise.all([
    sb.from('quran_juz_surat').select('juz, surat').order('juz').order('surat'),
    sb.from('quran_surat').select('nomor, nama, urutan').order('urutan')
  ]);
  if (mappingError) throw mappingError;
  if (suratError) throw suratError;
  const suratByNumber = Object.fromEntries((suratMaster || []).map(row => [Number(row.nomor), row.nama]));
  const master = {};
  (mapping || []).forEach(row => {
    const juz = String(row.juz);
    const nama = suratByNumber[Number(row.surat)];
    if (nama) (master[juz] ||= []).push(nama);
  });
  Object.keys(JUZ_SURAT_MAP).forEach(key => delete JUZ_SURAT_MAP[key]);
  Object.assign(JUZ_SURAT_MAP, master);
  quranMasterLoaded = true;
  return JUZ_SURAT_MAP;
}
function updateSuratByJuz(juzValue, suratId, selectedSurat=''){
  const surat = document.getElementById(suratId);
  if (!surat) return;
  const options = JUZ_SURAT_MAP[juzValue] || [];
  surat.disabled = !juzValue;
  surat.innerHTML = '<option value="">Pilih Surat</option>' + options.map(n=>`<option value="${n}">${n}</option>`).join('');
  const matchingSurat = options.find(n=>sameSuratName(n, selectedSurat));
  surat.value = matchingSurat || '';
}
async function setupJuzSurat(juzId, suratId, existingSurat=''){
  const juz = document.getElementById(juzId);
  const surat = document.getElementById(suratId);
  if (!juz || !surat) return;
  try { await loadQuranMasterFromDatabase(); }
  catch (error) { toast('Gagal memuat master Juz dan Surat: '+error.message, true); return; }
  juz.innerHTML = '<option value="">Pilih Juz</option>' + Object.keys(JUZ_SURAT_MAP).map(n=>`<option value="${n}">Juz ${n}</option>`).join('');
  const inferredJuz = Object.keys(JUZ_SURAT_MAP).find(n=>JUZ_SURAT_MAP[n].some(s=>sameSuratName(s, existingSurat))) || '';
  juz.value = inferredJuz;
  updateSuratByJuz(juz.value, suratId, existingSurat);
  juz.addEventListener('change', ()=>updateSuratByJuz(juz.value, suratId));
}
function gradeToDbValue(value){ return ({A:4,B:3,C:2,D:1})[value] ?? null; }
function gradeLabel(value){
  if (value === null || value === undefined || value === '') return '-';
  const n = Number(value); return ({4:'A',3:'B',2:'C',1:'D'})[n] || String(value);
}
async function setupGuruSiswaCascade(prefix){
  const classId = document.getElementById(prefix+'_kelas');
  const student = document.getElementById(prefix+'_siswa');
  if (!classId || !student || !sb) return;
  const {data: classes, error} = await sb.from('kelas').select('id, nama_kelas').order('nama_kelas');
  if (error) { toast('Gagal memuat kelas: '+error.message, true); return; }
  classId.innerHTML = '<option value="">Pilih Kelas</option>' + (classes||[]).map(k=>`<option value="${k.id}">${k.nama_kelas}</option>`).join('');
  student.innerHTML = '<option value="">Pilih kelas terlebih dahulu</option>';
  classId.addEventListener('change', async ()=>{
    student.innerHTML = '<option value="">Memuat siswa...</option>';
    const rows = await fetchSiswaByKelas(classId.value);
    student.innerHTML = '<option value="">Pilih Siswa</option>' + rows.map(s=>`<option value="${s.id}">${s.nama}${s.nis?' — '+s.nis:''}</option>`).join('');
  });
}

async function checkAccess(){
  if (!sb){ showGateCard('gateDenied'); document.getElementById('deniedMsg').textContent = 'Konfigurasi Supabase belum tersedia. Salin supabase-config.example.js menjadi supabase-config.js dan isi dari environment deployment.'; return; }
  showGateCard('gateChecking');
  const { data: { session }, error: sessionError } = await sb.auth.getSession();
  if (sessionError){
    showGateCard('gateDenied');
    document.getElementById('deniedMsg').textContent = 'Koneksi Supabase gagal. Periksa URL, publishable key, dan jaringan.';
    return;
  }
  if (!session){ showGateCard('gateLogin'); return; }
  const health = await checkSupabaseConnection();
  if (health.status === 'schema_missing'){
    showGateCard('gateDenied');
    document.getElementById('deniedMsg').textContent = 'Supabase terhubung, tetapi schema database yang diperlukan belum diterapkan.';
    return;
  }
  if (health.status === 'rls_denied'){
    showGateCard('gateDenied');
    document.getElementById('deniedMsg').textContent = 'Supabase terhubung, tetapi akses RLS untuk pemeriksaan database ditolak.';
    return;
  }
  if (health.status !== 'connected'){
    showGateCard('gateDenied');
    document.getElementById('deniedMsg').textContent = 'Koneksi database Supabase gagal. Periksa konfigurasi dan jaringan.';
    return;
  }
  const { data: profile, error } = await sb.from('profiles').select('nama, role').eq('id', session.user.id).single();
  if (error || !profile){
    document.getElementById('deniedMsg').textContent = 'Profil akun ini tidak ditemukan di database. Hubungi Admin.';
    showGateCard('gateDenied'); return;
  }
  myId = session.user.id; myRole = profile.role; myNama = profile.nama;

  if (myRole === 'wali_kelas'){
    const { data: kelasData } = await sb.from('kelas').select('id, nama_kelas').eq('wali_kelas_id', myId).maybeSingle();
    myKelasId = kelasData?.id || null;
  }
  if (myRole === 'orang_tua'){
    const { data: relasi } = await sb.from('orang_tua_siswa').select('siswa(id, nama, nis)').eq('user_id', myId);
    anakList = (relasi||[]).map(r=>r.siswa).filter(Boolean);
    if (anakList.length === 0){
      document.getElementById('deniedMsg').textContent = 'Akun ini belum ditautkan ke siswa manapun. Hubungi Admin.';
      showGateCard('gateDenied'); return;
    }
    anakAktifId = anakList[0].id;
  }

  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  document.getElementById('whoName').textContent = myNama;
  renderApp();
}

async function fetchGabunganQuran(siswaIds, limit=50){
  const [{data:t},{data:ts},{data:tf}] = await Promise.all([
    sb.from('tilawah_harian').select('tanggal, surat, halaman, poin, status, siswa(nama)').in('siswa_id', siswaIds).eq('status','approved'),
    sb.from('tahsin_quran').select('tanggal, jenis, jilid, halaman, nilai, keterangan, poin, siswa(nama)').in('siswa_id', siswaIds),
    sb.from('tahfidz_quran').select('tanggal, jenis, surat, ayat, nilai, keterangan, poin, siswa(nama)').in('siswa_id', siswaIds),
  ]);
  const rows = [
    ...(t||[]).map(r=>({ tanggal:r.tanggal, jenis:'Tilawah', detail:`${r.surat}${r.halaman?', hal '+r.halaman:''}`, poin:r.poin, namaSiswa:r.siswa?.nama||'-' })),
...(ts||[]).map(r=>({ tanggal:r.tanggal, jenis:'Tahsin', detail:`Jilid ${r.jilid||r.jenis}${r.halaman?', hal '+r.halaman:''}${r.keterangan?' — '+r.keterangan:''}`, nilai:r.nilai, poin:r.poin, namaSiswa:r.siswa?.nama||'-' })),
...(tf||[]).map(r=>({ tanggal:r.tanggal, jenis:'Tahfidz', detail:`${r.jenis} ${r.surat}${r.ayat?':'+r.ayat:''}`, nilai:r.nilai, poin:r.poin, namaSiswa:r.siswa?.nama||'-' })),
  ];
  rows.sort((a,b)=> b.tanggal.localeCompare(a.tanggal));
  return rows.slice(0, limit);
}

async function getSemuaPoinMentah(){
  // Ambil semua data poin mentah sekali jalan, dipakai bareng buat berbagai rekap
  const [{data:t},{data:ts},{data:tf},{data:ab},{data:pk}] = await Promise.all([
    sb.from('tilawah_harian').select('siswa_id, poin, direview_oleh').eq('status','approved'),
    sb.from('tahsin_quran').select('siswa_id, poin, guru_id, nilai'),
    sb.from('tahfidz_quran').select('siswa_id, poin, guru_id, nilai'),
    sb.from('absensi_siswa').select('siswa_id, poin'),
    sb.from('penilaian_karakter').select('siswa_id, poin'),
  ]);
  return { tilawah:t||[], tahsin:ts||[], tahfidz:tf||[], absensi:ab||[], karakter:pk||[] };
}

async function getRingkasanPerKelas(){
  const [{data:kelasList}, mentah] = await Promise.all([
    sb.from('kelas').select('id, nama_kelas').order('nama_kelas'),
    getSemuaPoinMentah()
  ]);
  const { data:siswaList } = await sb.from('siswa').select('id, kelas_id');
  const siswaKelasMap = {}; (siswaList||[]).forEach(s => siswaKelasMap[s.id] = s.kelas_id);

  const result = (kelasList||[]).map(k => ({ id:k.id, nama_kelas:k.nama_kelas, jumlahSiswa:0, tilawah:0, tahsin:0, tahfidz:0, karakter:0 }));
  const byId = {}; result.forEach(r => byId[r.id] = r);
  (siswaList||[]).forEach(s => { if (byId[s.kelas_id]) byId[s.kelas_id].jumlahSiswa++; });

  mentah.tilawah.forEach(r => { const kid = siswaKelasMap[r.siswa_id]; if (byId[kid]) byId[kid].tilawah += r.poin; });
  mentah.tahsin.forEach(r => { const kid = siswaKelasMap[r.siswa_id]; if (byId[kid]) byId[kid].tahsin += r.poin; });
  mentah.tahfidz.forEach(r => { const kid = siswaKelasMap[r.siswa_id]; if (byId[kid]) byId[kid].tahfidz += r.poin; });
  mentah.karakter.forEach(r => { const kid = siswaKelasMap[r.siswa_id]; if (byId[kid]) byId[kid].karakter += r.poin; });
  return result;
}

async function getRingkasanPerGuru(){
  const [{data:guruList}, mentah] = await Promise.all([
    sb.from('profiles').select('id, nama').eq('role','guru_quran').order('nama'),
    getSemuaPoinMentah()
  ]);
  const result = (guruList||[]).map(g => ({ id:g.id, nama:g.nama, tilawah:0, tahsin:0, tahfidz:0, jumlahCatatan:0 }));
  const byId = {}; result.forEach(r => byId[r.id] = r);

  mentah.tilawah.forEach(r => { if (r.direview_oleh && byId[r.direview_oleh]){ byId[r.direview_oleh].tilawah += r.poin; byId[r.direview_oleh].jumlahCatatan++; } });
  mentah.tahsin.forEach(r => { if (byId[r.guru_id]){ byId[r.guru_id].tahsin += r.poin; byId[r.guru_id].jumlahCatatan++; } });
  mentah.tahfidz.forEach(r => { if (byId[r.guru_id]){ byId[r.guru_id].tahfidz += r.poin; byId[r.guru_id].jumlahCatatan++; } });
  return result;
}

async function getRankingSiswa(limitEach=5){
  const [{data:siswaList}, mentah] = await Promise.all([
    sb.from('siswa').select('id, nama, kelas(nama_kelas)').eq('status','aktif'),
    getSemuaPoinMentah()
  ]);
  const totalMap = {};
  (siswaList||[]).forEach(s => { totalMap[s.id] = { nama:s.nama, kelas:s.kelas?.nama_kelas||'-', total:0 }; });
  [...mentah.tilawah, ...mentah.tahsin, ...mentah.tahfidz, ...mentah.absensi, ...mentah.karakter].forEach(r => {
    if (totalMap[r.siswa_id]) totalMap[r.siswa_id].total += r.poin;
  });
  const arr = Object.values(totalMap).sort((a,b) => b.total - a.total);
  return { top: arr.slice(0, limitEach), bottom: arr.slice(-limitEach).reverse() };
}

async function getRankingSiswaQuran(limit=5){
  const [{data:siswaList}, mentah] = await Promise.all([
    sb.from('siswa').select('id, nama, kelas(nama_kelas)').eq('status','aktif'),
    getSemuaPoinMentah()
  ]);
  const totalMap = {};
  (siswaList||[]).forEach(s => { totalMap[s.id] = { nama:s.nama, kelas:s.kelas?.nama_kelas||'-', total:0 }; });
  [...mentah.tilawah, ...mentah.tahsin, ...mentah.tahfidz].forEach(r => {
    if (totalMap[r.siswa_id]) totalMap[r.siswa_id].total += r.poin;
  });
  return Object.values(totalMap).sort((a,b) => b.total - a.total).slice(0, limit);
}
async function getTahfidzPerKelas(){
  const [{data:kelasList}] = await Promise.all([ sb.from('kelas').select('id, nama_kelas').order('nama_kelas') ]);
  const { data:siswaList } = await sb.from('siswa').select('id, kelas_id');
  const siswaKelasMap = {}; (siswaList||[]).forEach(s => siswaKelasMap[s.id] = s.kelas_id);
  const { data:tf } = await sb.from('tahfidz_quran').select('siswa_id, poin, nilai');

  const result = (kelasList||[]).map(k => ({ nama_kelas:k.nama_kelas, id:k.id, totalPoin:0, nilaiList:[] }));
  const byId = {}; result.forEach(r => byId[r.id] = r);
  (tf||[]).forEach(r => {
    const kid = siswaKelasMap[r.siswa_id]; if (!byId[kid]) return;
    byId[kid].totalPoin += r.poin;
    if (r.nilai !== null) byId[kid].nilaiList.push(r.nilai);
  });
  return result.map(r => ({ nama_kelas:r.nama_kelas, totalPoin:r.totalPoin, rataNilai: r.nilaiList.length ? Math.round(r.nilaiList.reduce((a,b)=>a+b,0)/r.nilaiList.length) : null }));
}

PAGE_BIND.admin.siswa = () => {
  const filter = document.getElementById('filterKelasSiswa');
  const search = document.getElementById('searchSiswa');
  filter.value = adminSiswaFilter;
  filter.addEventListener('change', e => { adminSiswaFilter = e.target.value; PAGE_LOAD.admin.siswa(); });
  search.value = adminSiswaSearch;
  search.addEventListener('input', e => { adminSiswaSearch = e.target.value; renderAdminSiswaRows(); });
  document.getElementById('btnDownloadTemplate').addEventListener('click', () => {
    const wsData = [
      ['nis', 'nama', 'nama_kelas', 'status'],
      ['S1A-11', 'Contoh Nama Siswa', kelasListCache[0]?.nama_kelas || '1A', 'aktif'],
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:14},{wch:26},{wch:14},{wch:12}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data Siswa');
    XLSX.writeFile(wb, 'template-siswa-tilmidz.xlsx');
  });

  document.getElementById('inputUploadSiswa').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('uploadSiswaFileName').textContent = file.name;
    const resultEl = document.getElementById('uploadSiswaResult');
    resultEl.innerHTML = 'Memproses...';

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

    const { data: taAktif } = await sb.from('tahun_ajaran').select('id').eq('is_active', true).single();
    const kelasByName = {}; kelasListCache.forEach(k => kelasByName[k.nama_kelas.trim().toLowerCase()] = k.id);

    let sukses = 0, gagal = [];
    for (const [i, row] of rows.entries()){
      const nis = String(row.nis||'').trim();
      const nama = String(row.nama||'').trim();
      const namaKelas = String(row.nama_kelas||'').trim();
      const status = String(row.status||'aktif').trim() || 'aktif';
      if (!nis || !nama || !namaKelas){ gagal.push(`Baris ${i+2}: data tidak lengkap`); continue; }
      const kelas_id = kelasByName[namaKelas.toLowerCase()];
      if (!kelas_id){ gagal.push(`Baris ${i+2}: kelas "${namaKelas}" tidak ditemukan`); continue; }
      const { error } = await sb.from('siswa').insert({ nis, nama, kelas_id, tahun_ajaran_id: taAktif?.id, status });
      if (error) gagal.push(`Baris ${i+2} (${nis}): ${error.message}`);
      else sukses++;
    }

    resultEl.innerHTML = `<span style="color:var(--good); font-weight:600;">${sukses} siswa berhasil diimport.</span>` +
      (gagal.length ? `<br><span style="color:var(--danger);">${gagal.length} baris gagal:</span><br>` + gagal.map(g=>`&bull; ${g}`).join('<br>') : '');
    toast(`Import selesai: ${sukses} berhasil, ${gagal.length} gagal`, gagal.length > 0 && sukses === 0);
    e.target.value = '';
    PAGE_LOAD.admin.siswa();
  });

  document.getElementById('btnAddSiswa').addEventListener('click', async ()=>{
    const nis = document.getElementById('newNis').value.trim();
    const nama = document.getElementById('newNamaSiswa').value.trim();
    const kelas_id = document.getElementById('newKelasSiswa').value;
    if (!nis || !nama || !kelas_id){ toast('Isi NIS, nama, dan pilih kelas', true); return; }
    const { data: kd } = await sb.from('kelas').select('tahun_ajaran_id').eq('id', kelas_id).single();
    const { error } = await sb.from('siswa').insert({ nis, nama, kelas_id, tahun_ajaran_id: kd.tahun_ajaran_id, status:'aktif' });
    if (error){ toast('Gagal: ' + error.message, true); return; }
    toast('Siswa ditambahkan'); document.getElementById('newNis').value=''; document.getElementById('newNamaSiswa').value='';
    PAGE_LOAD.admin.siswa();
  });

  document.getElementById('btnHapusSemuaSiswa').addEventListener('click', async ()=>{
    const ketik = prompt('Ini akan menghapus PERMANEN semua siswa dan seluruh data terkait (nilai, absensi, tilawah, dll). Ketik HAPUS SEMUA untuk konfirmasi:');
    if (ketik !== 'HAPUS SEMUA'){ toast('Dibatalkan, teks konfirmasi tidak cocok', true); return; }

    const btn = document.getElementById('btnHapusSemuaSiswa');
    btn.disabled = true; btn.textContent = 'Menghapus...';

    const { data: semuaSiswa } = await sb.from('siswa').select('id');
    const ids = (semuaSiswa||[]).map(s=>s.id);

    if (ids.length === 0){ toast('Tidak ada data siswa untuk dihapus'); btn.disabled=false; btn.textContent='Hapus semua siswa'; return; }

    const tabelTerkait = ['orang_tua_siswa','kelompok_siswa','penilaian_karakter','absensi_siswa','tilawah_harian','tahsin_quran','tahfidz_quran','rapor_periodik'];
    for (const t of tabelTerkait){
      const { error } = await sb.from(t).delete().in('siswa_id', ids);
      if (error){ toast(`Gagal hapus data di tabel ${t}: ${error.message}`, true); btn.disabled=false; btn.textContent='Hapus semua siswa'; return; }
    }

    const { error: errSiswa } = await sb.from('siswa').delete().in('id', ids);
    if (errSiswa){ toast('Gagal hapus siswa: '+errSiswa.message, true); btn.disabled=false; btn.textContent='Hapus semua siswa'; return; }

    toast(`${ids.length} siswa dan seluruh data terkait berhasil dihapus`);
    btn.disabled = false; btn.textContent = 'Hapus semua siswa';
    PAGE_LOAD.admin.siswa();
  });
};
let editingSiswaId = null;

function renderAdminSiswaRows(){
  const tbody = document.getElementById('tblSiswa'), empty = document.getElementById('emptySiswa');
  if (!tbody || !empty) return;
  const term = adminSiswaSearch.trim().toLowerCase();
  const rows = adminSiswaDataCache.filter(s =>
    (adminSiswaFilter === 'all' || String(s.kelas_id) === String(adminSiswaFilter)) &&
    (!term || String(s.nama||'').toLowerCase().includes(term) || String(s.nis||'').toLowerCase().includes(term))
  );
  empty.textContent = adminSiswaDataCache.length ? 'Tidak ada siswa yang cocok dengan filter.' : 'Belum ada data siswa.';

PAGE_LOAD.admin.kelas = async () => {
  const { data: waliList } = await sb.from('profiles').select('id, nama').in('role',['wali_kelas','guru_quran','kepala_sekolah']).order('nama');
  waliKelasListCache = waliList || [];
  const [{ data, error }, { data: siswaRows, error: siswaError }, { data: targetRows, error: targetError }] = await Promise.all([
    sb.from('kelas').select('id, nama_kelas, wali_kelas_id, profiles(nama)').order('nama_kelas'),
    // Deliberately count the same relationship used by delete validation:
    // every siswa row with this kelas_id, including inactive/legacy rows.
    sb.from('siswa').select('id, kelas_id'),
    // target_hafalan is a protected academic/configuration relation. It must
    // be counted before offering a DELETE action; never delete it as cleanup.
    sb.from('target_hafalan').select('kelas_id')
  ]);
  const tbody = document.getElementById('tblKelas'), empty = document.getElementById('emptyKelas');
  if (error){ toast('Gagal: '+error.message, true); return; }
  if (siswaError){ toast('Gagal menghitung siswa per kelas: '+siswaError.message, true); return; }
  if (targetError){ toast('Gagal memeriksa target hafalan per kelas: '+targetError.message, true); return; }
  if (!data || !data.length){ adminKelasState = []; tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  const counts = {}; (siswaRows||[]).forEach(s => { counts[String(s.kelas_id)] = (counts[String(s.kelas_id)]||0) + 1; });
  const targetCounts = {}; (targetRows||[]).forEach(t => { targetCounts[String(t.kelas_id)] = (targetCounts[String(t.kelas_id)]||0) + 1; });
  adminKelasState = data.map(k=>{
    const jumlahSiswa = counts[String(k.id)]||0;
    const jumlahTargetHafalan = targetCounts[String(k.id)]||0;
    return {...k, jumlahSiswa, jumlahTargetHafalan, dapatDihapus: jumlahSiswa === 0};
  });
  // target_hafalan is removable configuration for an empty class. The
  // server performs the final target count and ordered deletion; the UI
  // therefore only hides DELETE while students still exist.
  tbody.innerHTML = adminKelasState.map(renderKelasRow).join('');
};
window.adminDeleteKelas = async (id) => {
  const row = (adminKelasState || []).find(k => String(k.id) === String(id));
  const namaKelas = row?.nama_kelas || 'ini';
  const jumlahTarget = row?.jumlahTargetHafalan || 0;
  const konfirmasi = jumlahTarget > 0
    ? `Kelas ${namaKelas} tidak memiliki siswa. Target hafalan kelas ini juga akan dihapus. Lanjutkan?`
    : `Kelas ${namaKelas} tidak memiliki siswa. Hapus kelas ini?`;
  if (!confirm(konfirmasi)) return;
  try {
    const result = await callAdminAccounts({ action:'delete_empty_class', class_id:id });
    toast(`Kelas ${namaKelas} dihapus${result.result.deleted_target_hafalan ? ` bersama ${result.result.deleted_target_hafalan} target hafalan` : ''}.`);
    PAGE_LOAD.admin.kelas();
  } catch (error) {
    toast(error.message, true);
  }
};

const ACCOUNT_ROLE_LABEL = { admin:'Admin', guru_quran:"Guru Al-Qur'an", wali_kelas:'Wali Kelas', kepala_sekolah:'Kepala Sekolah' };
const htmlSafe = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ADMIN_ACCOUNTS_ENDPOINT = '/api/admin-accounts';
async function callAdminAccounts(body){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) throw new Error('Sesi Admin sudah berakhir. Silakan login kembali.');
  const response = await fetch(ADMIN_ACCOUNTS_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.access_token}`, apikey:SUPABASE_ANON_KEY}, body:JSON.stringify(body) });
  const result = await response.json().catch(()=>({}));
  if (!response.ok) throw new Error(result.error || 'Operasi akun gagal.');
  return result;
}
let adminAccountClasses = [];
function renderAdminAccounts(accounts){
  const body = document.getElementById('tblAccounts'), empty = document.getElementById('emptyAccounts');

  body.innerHTML = accounts.map(a => `<tr><td>${htmlSafe(a.nama)}</td><td>${htmlSafe(a.email)}</td><td><span class="badge">${htmlSafe(ACCOUNT_ROLE_LABEL[a.role] || a.role)}</span></td><td>${htmlSafe(a.status)}</td><td>${a.is_kepala_sekolah?'Ya':'Tidak'}</td><td>${htmlSafe((a.wali_kelas||[]).join(', ') || '-')}</td></tr>`).join('');
}

}

PAGE_BIND.admin['import-orang-tua'] = () => {
  const download = document.getElementById('btnDownloadParentTemplate');
  const input = document.getElementById('inputParentImport');
  const process = document.getElementById('btnProcessParentImport');
  const preview = document.getElementById('parentImportPreview');
  const fileError = document.getElementById('parentImportFileError');
  download.addEventListener('click', () => {
    const instruction = [
      ['PETUNJUK IMPORT DATA ORANG TUA'],
      ['Isi hanya sheet "Data Orang Tua". Hapus baris contoh sebelum mengisi data asli.'],
      ['Semua kolom wajib diisi. email harus cocok dengan akun Auth ber-role orang_tua yang sudah ada.'],
      ['nis_anak harus cocok dengan NIS pada tabel siswa. hubungan hanya: ayah, ibu, atau wali.'],
      ['Import tidak membuat akun baru, tidak membuat siswa baru, dan tidak menghapus data yang sudah ada.'],
    ];
    const rows = [PARENT_IMPORT_HEADERS, ['contoh.orangtua@example.com', 'CONTOH-NIS-001', 'ibu'], ['wali.contoh@example.com', 'CONTOH-NIS-002', 'ayah']];
    const wb = XLSX.utils.book_new();
    const guide = XLSX.utils.aoa_to_sheet(instruction); guide['!cols'] = [{wch:110}];
    const data = XLSX.utils.aoa_to_sheet(rows); data['!cols'] = [{wch:30},{wch:20},{wch:14}];
    XLSX.utils.book_append_sheet(wb, guide, 'Petunjuk'); XLSX.utils.book_append_sheet(wb, data, 'Data Orang Tua');
    XLSX.writeFile(wb, 'template-orang-tua-tilmidz.xlsx');
  });
  input.addEventListener('change', async event => {
    const file = event.target.files[0];
    adminParentImportRows = []; process.disabled = true; fileError.textContent = ''; preview.textContent = 'Membaca file...';
    if (!file) return;
    document.getElementById('parentImportFileName').textContent = file.name;
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
      const sheetName = wb.SheetNames.includes('Data Orang Tua') ? 'Data Orang Tua' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const matrix = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
      const headers = (matrix[0] || []).map(value => String(value));
      if (PARENT_IMPORT_HEADERS.some((header, index) => headers[index] !== header) || headers.length !== PARENT_IMPORT_HEADERS.length) {
        throw new Error(`Header wajib tepat: ${PARENT_IMPORT_HEADERS.join(', ')}.`);
      }
      adminParentImportRows = XLSX.utils.sheet_to_json(ws, { defval:'' }).filter(row => PARENT_IMPORT_HEADERS.some(header => String(row[header] ?? '').trim() !== ''));
      preview.innerHTML = `<strong>${adminParentImportRows.length} baris siap diproses</strong> dari sheet "${htmlSafe(sheetName)}".`;
      process.disabled = adminParentImportRows.length === 0;
      if (!adminParentImportRows.length) fileError.textContent = 'Tidak ada baris data setelah header.';
    } catch (error) { preview.textContent = 'File belum siap diproses.'; fileError.textContent = error.message || 'Format file tidak valid.'; }
    input.value = '';
  });
  process.addEventListener('click', async () => {
    if (!adminParentImportRows.length) return;
    process.disabled = true; process.textContent = 'Memproses...';
    try {
      const { data: { session } } = await sb.auth.getSession();
      const response = await fetch('/api/admin-parent-import', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token || ''}`, 'apikey':SUPABASE_ANON_KEY }, body:JSON.stringify({ rows:adminParentImportRows }) });
      const body = await response.json();
      if (!response.ok || body.error) throw new Error(body.error || 'Import gagal diproses.');
      document.getElementById('parentImportResult').innerHTML = parentImportResultHtml(body.result);
      toast(`Import selesai: ${body.result.success} berhasil, ${body.result.failed} gagal` , body.result.failed > 0 && body.result.success === 0);
      adminParentImportRows = [];
    } catch (error) { document.getElementById('parentImportResult').innerHTML = `<span style="color:var(--danger);">${htmlSafe(error.message)}</span>`; toast('Import gagal diproses', true); }
    process.disabled = adminParentImportRows.length === 0; process.textContent = 'Proses Import';
  });
};

function getRentangPeriode(periode){
  const today = new Date();
  const toIso = (d) => d.toISOString().slice(0,10);
  if (periode === 'harian'){ return { from: toIso(today), to: toIso(today), label: 'Hari ini, ' + toIso(today) }; }
  if (periode === 'bulanan'){ const first = new Date(today.getFullYear(), today.getMonth(), 1); return { from: toIso(first), to: toIso(today), label: `${toIso(first)} s/d ${toIso(today)}` }; }
  const d180 = new Date(today); d180.setDate(d180.getDate() - 180);
  return { from: toIso(d180), to: toIso(today), label: `${toIso(d180)} s/d ${toIso(today)} (180 hari terakhir)` };
}

PAGE_LOAD.admin.presensi = async () => {
  const kelasList = await isiFilterKelas('p_filterKelas');
  const periode = document.getElementById('p_periode').value;
  const filterKelasId = document.getElementById('p_filterKelas').value || 'all';
  const { from, to, label } = getRentangPeriode(periode);
  document.getElementById('p_rangeLabel').textContent = 'Rentang: ' + label;

  let siswaQuery = sb.from('siswa').select('id, nama, kelas_id, kelas(nama_kelas)').eq('status','aktif');
  if (filterKelasId !== 'all') siswaQuery = siswaQuery.eq('kelas_id', filterKelasId);
  const { data: siswaList } = await siswaQuery;
  const ids = (siswaList||[]).map(s=>s.id);

  const tbody = document.getElementById('p_tbl'), empty = document.getElementById('p_empty');
  if (!ids.length){
    tbody.innerHTML=''; empty.style.display='block';
    if (window._pChart) window._pChart.destroy();
    return;
  }

  const { data: absensi, error } = await sb.from('absensi_siswa').select('siswa_id, status, poin').in('siswa_id', ids).gte('tanggal', from).lte('tanggal', to);
  if (error){ toast('Gagal ambil data presensi: '+error.message, true); return; }

  const rekapPerSiswa = {};
  (siswaList||[]).forEach(s => { rekapPerSiswa[s.id] = { nama:s.nama, kelas:s.kelas?.nama_kelas||'-', kelas_id:s.kelas_id, hadir:0, sakit:0, izin:0, alpa:0, poin:0 }; });
  (absensi||[]).forEach(a => {
    const r = rekapPerSiswa[a.siswa_id]; if (!r) return;
    r.poin += a.poin;
    if (a.status === 'hadir') r.hadir++;
    else if (a.status === 'sakit') r.sakit++;
    else if (a.status === 'izin') r.izin++;
    else if (a.status === 'alpha') r.alpa++;
  });
  const rows = Object.values(rekapPerSiswa);

  if (!(absensi||[]).length){ empty.style.display='block'; } else { empty.style.display='none'; }
  tbody.innerHTML = rows.map(r=>`<tr><td>${r.nama}</td><td>${r.kelas}</td><td>${r.hadir}</td><td>${r.sakit}</td><td>${r.izin}</td><td>${r.alpa}</td><td>${fmtPoin(r.poin)}</td></tr>`).join('');

  // chart: kalau "semua kelas" -> agregat per kelas; kalau kelas spesifik -> per siswa
  let chartLabels, chartData;
  const titleEl = document.getElementById('p_chartTitle');
  if (filterKelasId === 'all'){
    titleEl.textContent = 'Rekap kehadiran per kelas';
    const perKelas = {};
    (kelasList||[]).forEach(k => { perKelas[k.id] = { nama:k.nama_kelas, hadir:0, sakit:0, izin:0, alpa:0 }; });
    rows.forEach(r => { if (perKelas[r.kelas_id]){ perKelas[r.kelas_id].hadir+=r.hadir; perKelas[r.kelas_id].sakit+=r.sakit; perKelas[r.kelas_id].izin+=r.izin; perKelas[r.kelas_id].alpa+=r.alpa; } });
    const arr = Object.values(perKelas);
    chartLabels = arr.map(a=>a.nama);
    chartData = { hadir:arr.map(a=>a.hadir), sakit:arr.map(a=>a.sakit), izin:arr.map(a=>a.izin), alpa:arr.map(a=>a.alpa) };
  } else {
    titleEl.textContent = 'Rekap kehadiran per siswa — kelas ' + (rows[0]?.kelas || '');
    chartLabels = rows.map(r=>r.nama);
    chartData = { hadir:rows.map(r=>r.hadir), sakit:rows.map(r=>r.sakit), izin:rows.map(r=>r.izin), alpa:rows.map(r=>r.alpa) };
  }

  if (window._pChart) window._pChart.destroy();
  window._pChart = new Chart(document.getElementById('p_chart'), {
    type:'bar',
    data:{ labels:chartLabels, datasets:[
      {label:'Hadir', data:chartData.hadir, backgroundColor:'#2B6350'},
      {label:'Sakit', data:chartData.sakit, backgroundColor:'#B6842A'},
      {label:'Izin', data:chartData.izin, backgroundColor:'#8C6A12'},
      {label:'Alpa', data:chartData.alpa, backgroundColor:'#A63F29'},
    ]},
    options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true, grid:{color:'#E4DFCB'}} } }
  });
};

    <table>
      <thead><tr><th>NIS</th><th>Siswa</th><th>Kehadiran hari ini</th><th>Histori (Hadir/S/I/A)</th></tr></thead>
      <tbody id="w_tblAbsen"></tbody>
    </table>
    <div class="empty" id="w_emptyAbsen" style="display:none;">Belum ada siswa di kelas ini.</div>
  </div>`;

const absenState = {}; // { siswa_id: 'hadir'|'sakit'|'izin'|'alpha' }
const STATUS_MAP = [ ['hadir','H'], ['sakit','S'], ['izin','I'], ['alpha','A'] ];

function renderAbsenRow(s, histori){
  const h = histori[s.id] || { hadir:0, sakit:0, izin:0, alpha:0 };
  const current = absenState[s.id];
  const btns = STATUS_MAP.map(([val,label]) => {
    const sel = current === val;
    const bg = sel ? (val==='hadir' ? 'var(--good)' : val==='alpha' ? 'var(--danger)' : 'var(--accent)') : 'transparent';
    const color = sel ? '#fff' : 'var(--ink-soft)';
    return `<button type="button" class="absen-btn" data-siswa="${s.id}" data-val="${val}" style="width:34px; height:30px; border-radius:6px; border:1px solid var(--border); background:${bg}; color:${color}; font-weight:700; font-size:12px; cursor:pointer;">${label}</button>`;
  }).join(' ');
  return `<tr>
    <td>${s.nis}</td>
    <td>${s.nama}</td>
    <td><div style="display:flex; gap:6px;">${btns}</div></td>
    <td style="color:var(--ink-soft);">${h.hadir}/${h.sakit}/${h.izin}/${h.alpha}</td>
  </tr>`;
}

function updateAbsenCounters(){
  const vals = Object.values(absenState);
  document.getElementById('w_countHadir').textContent = vals.filter(v=>v==='hadir').length;
  document.getElementById('w_countSakit').textContent = vals.filter(v=>v==='sakit').length;
  document.getElementById('w_countIzin').textContent = vals.filter(v=>v==='izin').length;
  document.getElementById('w_countAlpha').textContent = vals.filter(v=>v==='alpha').length;
}

PAGE_LOAD.wali_kelas.absensi = async () => {
  if (!myKelasId) return;
  const tanggal = document.getElementById('w_tanggalAbsen').value || new Date().toISOString().slice(0,10);
  const siswa = await fetchSiswaByKelas(myKelasId);
  const tbody = document.getElementById('w_tblAbsen'), empty = document.getElementById('w_emptyAbsen');

  if (!siswa.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  // histori total per siswa (semua tanggal)
  const ids = siswa.map(s=>s.id);
  const { data: semuaAbsen } = await sb.from('absensi_siswa').select('siswa_id, status').in('siswa_id', ids);
  const histori = {};
  (semuaAbsen||[]).forEach(a=>{
    if (!histori[a.siswa_id]) histori[a.siswa_id] = { hadir:0, sakit:0, izin:0, alpha:0 };
    histori[a.siswa_id][a.status]++;
  });

  // absen yang sudah tersimpan untuk tanggal ini -> prefill absenState
  const { data: absenHariIni } = await sb.from('absensi_siswa').select('siswa_id, status').eq('wali_kelas_id', myId).eq('tanggal', tanggal);
  Object.keys(absenState).forEach(k => delete absenState[k]);
  (absenHariIni||[]).forEach(a => { absenState[a.siswa_id] = a.status; });

  // default: siswa yang belum ada catatan absen di tanggal ini otomatis dianggap Hadir
  siswa.forEach(s => { if (!absenState[s.id]) absenState[s.id] = 'hadir'; });

  PAGE_LOAD.wali_kelas._rerenderRows = () => {
    tbody.innerHTML = siswa.map(s => renderAbsenRow(s, histori)).join('');
    updateAbsenCounters();
  };
  PAGE_LOAD.wali_kelas._rerenderRows();
};

PAGE_LOAD.kepala_sekolah.capaian = async () => {
  const juz=document.getElementById('k_capaian_juz')?.value;
  if(!juz)return;
  const {data:students,error:studentsError}=await sb.from('siswa').select('id,nama,kelas(nama_kelas)').eq('status','aktif').order('nama');
  if (studentsError){ toast('Gagal memuat siswa: '+studentsError.message,true); return; }
  const ids=(students||[]).map(s=>s.id);
  const [{data:master,error:masterError},{data:records,error:recordsError}]=await Promise.all([
    sb.from('quran_juz_surat').select('juz,surat,quran_surat(nomor,nama)').eq('juz',Number(juz)),
    ids.length ? sb.from('tahfidz_quran').select('siswa_id,juz,surat').in('siswa_id',ids) : Promise.resolve({data:[],error:null})
  ]);
  if (masterError){ toast('Gagal memuat mapping Surat Juz: '+masterError.message,true); return; }
  if (recordsError){ toast('Gagal memuat capaian Tahfidz: '+recordsError.message,true); return; }
  const targetNames=(master||[]).map(r=>r.quran_surat?.nama).filter(Boolean);
  const byStudent={}; const juzByStudent={};
  (records||[]).forEach(r=>{
    if(!byStudent[r.siswa_id])byStudent[r.siswa_id]=new Set();
    if(!juzByStudent[r.siswa_id])juzByStudent[r.siswa_id]=new Set();
    if(r.juz!==null && r.juz!==undefined)juzByStudent[r.siswa_id].add(Number(r.juz));
    if(Number(r.juz)===Number(juz) && r.surat)byStudent[r.siswa_id].add(r.surat);
  });
  const rows=(students||[]).map(s=>{
    const done=byStudent[s.id]||new Set();
    const selesai=targetNames.length>0 && targetNames.every(target=>[...done].some(value=>sameSuratName(target,value)));
    return {kelas:s.kelas?.nama_kelas||'-',nama:s.nama,total:(juzByStudent[s.id]||new Set()).size,selesai};
  }).sort((a,b)=>b.total-a.total || a.nama.localeCompare(b.nama));
  const body=document.getElementById('k_tblCapaian');
  document.getElementById('k_emptyCapaian').style.display=rows.length?'none':'block';
  body.innerHTML=rows.map(r=>`<tr><td>${r.kelas}</td><td>${r.nama}</td><td>${r.total} juz</td><td>${r.selesai?'<span class="badge badge-approved">Selesai</span>':'Belum selesai'}</td></tr>`).join('');
};

      <div class="field"><label>Durasi (menit)</label><input type="number" id="o_durasiLapor" min="1"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Surat</label><input type="text" id="o_suratLapor" placeholder="mis. Al-Baqarah"></div>
      <div class="field"><label>Halaman</label><input type="text" id="o_halamanLapor" placeholder="mis. 5-7"></div>
    </div>
    <div class="field"><label>Catatan (opsional)</label><input type="text" id="o_catatanLapor"></div>
    <button class="btn" id="o_btnKirimLapor">Kirim laporan</button>
  </div>
  <div class="card">
    <h3 style="font-size:15px; font-weight:600; margin-bottom:10px;">Riwayat laporan lo</h3>
    <table><thead><tr><th>Tanggal</th><th>Surat/Halaman</th><th>Status</th><th>Poin</th><th>Catatan Guru</th></tr></thead><tbody id="o_tblLapor"></tbody></table>
    <div class="empty" id="o_emptyLapor" style="display:none;">Belum ada laporan.</div>
  </div>`;
PAGE_BIND.orang_tua.lapor = () => {
  document.getElementById('o_tanggalLapor').valueAsDate = new Date();
  document.getElementById('o_btnKirimLapor').addEventListener('click', async ()=>{
    const tanggal = document.getElementById('o_tanggalLapor').value;
    const durasi_menit = document.getElementById('o_durasiLapor').value || null;
    const surat = document.getElementById('o_suratLapor').value.trim();
    const halaman = document.getElementById('o_halamanLapor').value.trim();
    const catatan_ortu = document.getElementById('o_catatanLapor').value.trim();
    if (!surat){ toast('Isi surat yang dibaca dulu', true); return; }
    const { error } = await sb.from('tilawah_harian').insert({
      siswa_id: anakAktifId, diusulkan_oleh: myId, tanggal, surat, halaman: halaman||null,
      durasi_menit, catatan_ortu: catatan_ortu||null, status:'pending', poin: 1
    });
    if (error){ toast('Gagal: '+error.message, true); return; }
    toast('Laporan terkirim (+1 poin), menunggu review guru');
    document.getElementById('o_suratLapor').value=''; document.getElementById('o_halamanLapor').value=''; document.getElementById('o_catatanLapor').value=''; document.getElementById('o_durasiLapor').value='';
    PAGE_LOAD.orang_tua.lapor();
  });
};
PAGE_LOAD.orang_tua.lapor = async () => {
  const { data, error } = await sb.from('tilawah_harian').select('tanggal, surat, halaman, status, poin, catatan_guru').eq('siswa_id', anakAktifId).eq('diusulkan_oleh', myId).order('tanggal',{ascending:false}).limit(30);
  const tbody = document.getElementById('o_tblLapor'), empty = document.getElementById('o_emptyLapor');
  if (error){ toast('Gagal: '+error.message, true); return; }
  if (!data || !data.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  const sLabel = {pending:'Menunggu', approved:'Disetujui', rejected:'Ditolak'};
  const sBadge = {pending:'badge-pending', approved:'badge-approved', rejected:'badge-rejected'};
  tbody.innerHTML = data.map(r=>`<tr><td>${r.tanggal}</td><td>${r.surat}${r.halaman?', hal '+r.halaman:''}</td><td><span class="badge ${sBadge[r.status]}">${sLabel[r.status]}</span></td><td>${fmtPoin(r.poin)}</td><td>${r.catatan_guru||'-'}</td></tr>`).join('');
};

PAGE_HTML.orang_tua.tahsin = () => `
  <div class="pagehead"><div><h1>Laporan Tahsin</h1><p>Laporan TAHSIN anak, terpisah dari Tahfidz dan Tilawah.</p></div></div>
  <div class="card"><div class="row2"><div class="field"><label>Mulai</label><input type="date" id="o_ts_from"></div><div class="field"><label>Sampai</label><input type="date" id="o_ts_to"></div></div><button class="btn" id="o_ts_filter">Terapkan Filter</button></div>
  <div class="card"><table><thead><tr><th>Nama Siswa</th><th>Kelas</th><th>Tanggal</th><th>Jilid</th><th>Halaman</th><th>Nilai</th><th>Catatan Guru</th></tr></thead><tbody id="o_tblTahsin"></tbody></table><div class="empty" id="o_emptyTahsin" style="display:none;">Belum ada laporan tahsin.</div></div>`;
PAGE_BIND.orang_tua.tahsin = () => document.getElementById('o_ts_filter').addEventListener('click', PAGE_LOAD.orang_tua.tahsin);
PAGE_LOAD.orang_tua.tahsin = async () => {
  let query = sb.from('tahsin_quran').select('tanggal, jilid, halaman, nilai, keterangan, siswa(nama, kelas(nama_kelas))').eq('siswa_id', anakAktifId).eq('jenis','TAHSIN').order('tanggal',{ascending:false});
  const from = document.getElementById('o_ts_from')?.value, to = document.getElementById('o_ts_to')?.value;
  if (from) query = query.gte('tanggal', from); if (to) query = query.lte('tanggal', to);
  const {data,error} = await query; const body=document.getElementById('o_tblTahsin'), empty=document.getElementById('o_emptyTahsin');
  if (error){ toast('Gagal memuat laporan tahsin: '+error.message,true); return; }
  empty.style.display = data?.length ? 'none' : 'block';
  body.innerHTML = (data||[]).map(r=>`<tr><td>${r.siswa?.nama||'-'}</td><td>${r.siswa?.kelas?.nama_kelas||'-'}</td><td>${r.tanggal}</td><td>${r.jilid||'-'}</td><td>${r.halaman||'-'}</td><td>${gradeLabel(r.nilai)}</td><td>${r.keterangan||'-'}</td></tr>`).join('');
};
